<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div style="display:none;">
        <img id="source"
            src="https://www.shutterstock.com/image-illustration/tennis-racket-icon-illustration-on-260nw-466955171.jpg"
            alt="">
    </div>
    <canvas id="canvas" width="100vh" height="100%"></canvas>
    <script type="application/javascript">

        class Paddle {
            constructor(side) {
                this.side = side;
                this.y = 0
            }
        }

        class Ball {
            constructor() {
                const shouldGoLeft = Math.random() > 0.5;
                this.angle = shouldGoLeft ? 135 : 45;

                this.y = this.x = 0.5;
            }
        }

        const paddles = [
            new Paddle(0),
            new Paddle(1)
        ]

        const theBall = new Ball();

        const myPaddle = paddles[0];
        const theirPaddle = paddles[1];

        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        let keydown = null;

        function onKeyDown(event) {

            /*if (event.key == "s" || event.key == "w") {
                if (event.key == "s") myPaddle.y += 0.01;
                else myPaddle.y -= 0.01;

                myPaddle.y = Math.min(1 - 0.24, myPaddle.y)
                myPaddle.y = Math.max(0, myPaddle.y)

                console.log("Moved My Paddle")
            }

            if (event.key == "ArrowDown" || event.key == "ArrowUp") {
                if (event.key == "ArrowDown") theirPaddle.y += 0.01;
                else theirPaddle.y -= 0.01;

                theirPaddle.y = Math.min(1 - 0.24, theirPaddle.y)
                theirPaddle.y = Math.max(0, theirPaddle.y)


            }*/
            keydown = event.key;

        }

        function onKeyUp(event) {
            keydown = null;
        }

        let speed = 0.005;
        const BASE_SPEED = 0.005;

        function resetBall() {
            const shouldGoLeft = Math.random() > 0.5;
            theBall.angle = shouldGoLeft ? 135 : 45;
            theBall.y = theBall.x = 0.5;
            speed = BASE_SPEED;
        }

        function moveBall() {

            // Normalize the angle to [0, 360) and nudge it off perfectly
            // horizontal/vertical trajectories (those can never be scored).
            theBall.angle = ((theBall.angle % 360) + 360) % 360;
            if (theBall.angle % 180 === 0 || theBall.angle % 180 === 90) {
                theBall.angle += 2;
            }

            // Math.cos/Math.sin expect radians
            const radians = theBall.angle * Math.PI / 180;
            const xVelocity = Math.cos(radians) * speed;
            const yVelocity = Math.sin(radians) * speed;

            // remember where the ball came from (for swept collision below)
            const prevX = theBall.x;
            const prevY = theBall.y;

            theBall.x += xVelocity;
            theBall.y += yVelocity;

            // Bounce off the top/bottom walls: reflect the Y direction
            const movingUp = yVelocity < 0;
            if (theBall.y < 0 && movingUp) {
                theBall.y = 0;
                theBall.angle = -theBall.angle;
            }
            if (theBall.y > 1 && !movingUp) {
                theBall.y = 1;
                theBall.angle = -theBall.angle;
            }

            for (const paddle of paddles) {
                const posY = paddle.y;
                const height = 0.24;

                const posX = paddle == myPaddle ? 0 : 1 - 0.06;
                const width = 0.09;
                // the plane the ball bounces on (inner face of the paddle)
                const face = paddle == myPaddle ? posX + width : posX;

                // swept overlap over the ball's whole step, so fast balls
                // cannot jump over the paddle between two frames
                const yLo = Math.min(prevY, theBall.y);
                const yHi = Math.max(prevY, theBall.y);
                const withinY = yHi >= posY && yLo <= posY + height;
                // the ball crossed the paddle's face this frame, moving toward it
                const crossing = paddle == myPaddle
                    ? prevX >= face && theBall.x <= face
                    : prevX <= face && theBall.x >= face;

                if (withinY && crossing) {
                    // Bounce off the paddle: reflect the X direction
                    theBall.angle = 180 - theBall.angle;
                    theBall.x = face;

                    speed += 0.0002;
                }
            }

            // The ball got past a paddle: serve a new one from the middle
            if (theBall.x < -0.05 || theBall.x > 1.05) {
                resetBall();
            }
        }

        function movePaddle() {
            if (keydown != null) {
                if (keydown == "s" || keydown == "w") {
                    if (keydown == "s") myPaddle.y += 0.005;
                    else myPaddle.y -= 0.005;

                    myPaddle.y = Math.min(1 - 0.24, myPaddle.y)
                    myPaddle.y = Math.max(0, myPaddle.y)

                    //console.log("Moved My Paddle")
                }

                if (keydown == "ArrowDown" || keydown == "ArrowUp") {
                    if (keydown == "ArrowDown") theirPaddle.y += 0.005;
                    else theirPaddle.y -= 0.005;

                    theirPaddle.y = Math.min(1 - 0.24, theirPaddle.y)
                    theirPaddle.y = Math.max(0, theirPaddle.y)

                }
            }
        }


        function resizeCanvas() {
            canvas.width = window.innerWidth - 20;
            canvas.height = window.innerHeight - 20;

            drawStuff();
        }

        resizeCanvas();

        function drawStuff() {
            if (canvas.getContext) {
                const ctx = canvas.getContext("2d");
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";//ctx.fillRect(10, 10, 25, canvas.height * 0.35);
                const image = document.getElementById("source");

                // drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
                for (const paddle of paddles) {
                    const posY = canvas.height * paddle.y;
                    if (paddle == myPaddle) {
                        ctx.drawImage(image, 50, 0, 144, canvas.height * 0.26, 21, posY, canvas.height * 0.14, canvas.height * 0.24);
                    } else {
                        ctx.drawImage(image, 50, 0, 144, canvas.height * 0.26, canvas.width - (canvas.height * 0.14), posY, canvas.height * 0.14, canvas.height * 0.24);
                    }
                }

                const circle = new Path2D();
                circle.arc(canvas.width * theBall.x, canvas.height * theBall.y, 25, 0, 2 * Math.PI);

                ctx.fillStyle = "green";
                ctx.fill(circle);

            }

            moveBall();
            movePaddle();

            window.requestAnimationFrame(drawStuff);
        }

    </script>
</body>

</html>
